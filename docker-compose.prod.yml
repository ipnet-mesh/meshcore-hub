# MeshCore Hub - Production Docker Compose Override
#
# Connects core services to an external proxy network for
# reverse proxy access (Traefik, Nginx, Caddy, etc.).
# No ports are exposed directly — all traffic goes through the reverse proxy.
#
# NOTE: the bundled 'postgres' service is NOT started by the 'core' profile
# with this override (that convenience is dev-only, via docker-compose.dev.yml).
# Point the DATABASE_* variables at your shared/external instance instead —
# starting the bundled container alongside it would shadow a 'postgres' host
# on the same network. Opt in explicitly with `--profile postgres` (or
# `--profile all`) if you really want the bundled database on this host.
# The same applies to the bundled 'redis' service (a required dependency of
# the API): point REDIS_* at your shared/external instance, or opt into the
# bundled one explicitly with `--profile cache` (or `--profile all`).
#
# Prerequisites:
#   docker network create proxy-net
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# With Traefik:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.traefik.yml up -d

services:
  collector:
    networks:
      - default
      - proxy-net

  api:
    networks:
      - default
      - proxy-net

  web:
    networks:
      - default
      - proxy-net

  migrate:
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true
